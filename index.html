<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>शुभ विवाह | Dr. Kranti & Er. Rahul</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-ivory: #FAF7F2;
      --bg-blush: #F5E6E4;
      --bg-sage: #E6EDE8;
      --gold-primary: #C59B5F;
      --gold-dark: #9E7840;
      --terracotta: #8C4A48;
      --text-main: #3D3532;
      --text-muted: #6E625E;
      --card-glass: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', 'Noto Serif Devanagari', sans-serif;
      background: linear-gradient(180deg, var(--bg-ivory) 0%, var(--bg-blush) 35%, var(--bg-sage) 70%, var(--bg-ivory) 100%);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Curtain Overlay */
    #curtain-overlay {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity 1.1s ease, visibility 1.1s ease;
    }
    .curtain-panel {
      position: absolute; top: 0; bottom: 0; width: 50%;
      background: radial-gradient(circle at center, #F9F2EC 0%, #EAD6D3 100%);
      transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
      box-shadow: inset 0 0 60px rgba(197, 155, 95, 0.2);
    }
    .curtain-left { left: 0; border-right: 1px solid rgba(197, 155, 95, 0.4); }
    .curtain-right { right: 0; border-left: 1px solid rgba(197, 155, 95, 0.4); }
    #curtain-overlay.opened .curtain-left { transform: translateX(-100%); }
    #curtain-overlay.opened .curtain-right { transform: translateX(100%); }
    #curtain-overlay.opened { opacity: 0; visibility: hidden; pointer-events: none; }

    .seal-container {
      position: relative; z-index: 2; text-align: center; padding: 2rem;
    }
    .wax-seal-btn {
      width: 140px; height: 140px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #DFB980, #B88A4B);
      border: 4px solid #FFFDF9;
      box-shadow: 0 12px 35px rgba(140, 74, 72, 0.25), inset 0 0 15px rgba(255,255,255,0.5);
      color: #FFFDF9; font-family: 'Cinzel Decorative', serif;
      font-size: 1.15rem; font-weight: 700; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 0 auto 1.2rem; transition: transform 0.3s ease;
      animation: pulseGlow 2.4s infinite;
    }
    .wax-seal-btn:hover { transform: scale(1.06); }
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 10px 30px rgba(197, 155, 95, 0.4); }
      50% { box-shadow: 0 10px 45px rgba(197, 155, 95, 0.85); }
    }

    /* Falling Petals Canvas */
    #petals-canvas {
      position: fixed; inset: 0; pointer-events: none; z-index: 50;
    }

    /* Floating Controls */
    .top-controls {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      display: flex; gap: 8px;
    }
    .pill-btn {
      background: var(--card-glass); backdrop-filter: blur(10px);
      border: 1px solid rgba(197, 155, 95, 0.45);
      color: var(--terracotta); padding: 8px 14px; border-radius: 999px;
      font-size: 0.8rem; font-weight: 600; cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06); transition: all 0.2s ease;
    }
    .pill-btn:hover { background: #FFF; transform: translateY(-1px); }

    .music-bar {
      position: fixed; bottom: 16px; left: 16px; z-index: 100;
      background: var(--card-glass); backdrop-filter: blur(12px);
      border: 1px solid rgba(197, 155, 95, 0.5);
      padding: 8px 14px; border-radius: 999px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 6px 24px rgba(61, 53, 50, 0.12);
      font-size: 0.78rem; color: var(--text-main);
    }
    .music-bar button {
      background: none; border: none; color: var(--terracotta);
      font-weight: 700; cursor: pointer; font-size: 0.9rem; padding: 2px 6px;
    }

    /* Main Sections */
    .section {
      max-width: 780px; margin: 0 auto; padding: 4.5rem 1.25rem;
      position: relative; z-index: 10;
    }
    .card {
      background: var(--card-glass); backdrop-filter: blur(14px);
      border: 1px solid rgba(197, 155, 95, 0.35);
      border-radius: 24px; padding: 2.5rem 1.75rem;
      box-shadow: 0 15px 40px rgba(61, 53, 50, 0.06);
      text-align: center;
    }
    .shloka {
      font-family: 'Noto Serif Devanagari', serif;
      color: var(--terracotta); font-size: 1.05rem; line-height: 1.8;
      margin-bottom: 1.25rem;
    }
    .subtitle-tag {
      letter-spacing: 0.2em; text-transform: uppercase;
      font-size: 0.75rem; color: var(--gold-dark); font-weight: 600;
      margin-bottom: 0.75rem;
    }
    .couple-names {
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
      font-size: clamp(2.3rem, 6vw, 3.6rem);
      color: var(--terracotta); font-weight: 700; line-height: 1.2;
      margin: 0.5rem 0;
    }
    .ampersand {
      display: block; font-family: 'Cinzel Decorative', serif;
      font-size: 1.6rem; color: var(--gold-primary); margin: 0.25rem 0;
    }
    .parents-info {
      font-size: 0.92rem; color: var(--text-muted); line-height: 1.7;
      margin-top: 1.25rem;
    }
    .divider {
      width: 90px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-primary), transparent);
      margin: 1.5rem auto;
    }

    /* Events Grid */
    .events-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.15rem; margin-top: 1.75rem; text-align: left;
    }
    .event-box {
      background: rgba(255, 253, 249, 0.9);
      border: 1px solid rgba(197, 155, 95, 0.3);
      border-radius: 18px; padding: 1.25rem;
      transition: transform 0.25s ease;
    }
    .event-box:hover { transform: translateY(-3px); }
    .event-title {
      font-family: 'Cormorant Garamond', 'Noto Serif Devanagari', serif;
      font-size: 1.3rem; font-weight: 700; color: var(--terracotta);
    }
    .event-date {
      font-size: 0.85rem; font-weight: 600; color: var(--gold-dark);
